name: GolfNow Discovery

# run-name embeds dispatch_token (when the controller supplies one) into
# this run's own display title, so the controller can reliably find
# "the run it dispatched" afterwards by identity rather than by guessing
# from creation time -- which could otherwise match an unrelated
# scheduled or manually-triggered run. Scheduled/manual runs never set
# dispatch_token, so they fall back to the default title untouched.
run-name: ${{ github.event.inputs.dispatch_token && format('GolfNow Discovery [ctrl:{0}]', github.event.inputs.dispatch_token) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      limit_nodes:
        description: "Number of discovery nodes to run (ignored when node_ids is set)"
        required: false
        default: "8"
      node_ids:
        description: "Comma-separated exact discovery node IDs to run (overrides limit_nodes/ordering; leave blank for normal scheduled behaviour)"
        required: false
        default: ""
      dispatch_token:
        description: "UK Expansion Controller dispatch identity token (internal use; leave blank for manual/scheduled runs)"
        required: false

  schedule:
    - cron: '0 5 * * *'

jobs:
  discover:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIMIT_NODES: ${{ github.event.inputs.limit_nodes }}
      NODE_IDS: ${{ github.event.inputs.node_ids }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install playwright @supabase/supabase-js
          npx playwright install chromium

      - name: Run GolfNow discovery
        run: node scripts/golfnow-discovery.js
