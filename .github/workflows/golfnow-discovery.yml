name: GolfNow Discovery

on:
  workflow_dispatch:
    inputs:
      limit_nodes:
        description: "Number of discovery nodes to run"
        required: false
        default: "3"

jobs:
  discover:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIMIT_NODES: ${{ github.event.inputs.limit_nodes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install playwright @supabase/supabase-js
          npx playwright install chromium

      - name: Run GolfNow discovery
        run: node scripts/golfnow-discovery.js
