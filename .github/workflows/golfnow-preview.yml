name: GolfNow Preview

on:
  workflow_dispatch:

jobs:
  golfnow-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GolfNow preview
        run: node scraper/golfnow-preview.js

      - name: Upload GolfNow preview output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golfnow-preview-output
          path: golfnow-api-test-output
