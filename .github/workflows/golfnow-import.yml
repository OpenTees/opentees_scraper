name: GolfNow Import

on:
  workflow_dispatch:

jobs:
  golfnow-import:
    runs-on: ubuntu-latest

    env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  MANUAL_IMPORT_SECRET: ${{ secrets.MANUAL_IMPORT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GolfNow import
        run: node scraper/golfnow-import.js

      - name: Upload GolfNow import output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golfnow-import-output
          path: golfnow-import-output
